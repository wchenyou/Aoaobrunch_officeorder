<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>點餐｜嗷嗷早午餐團購</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><rect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23F08A24%27/><g fill=%27white%27><ellipse cx=%2732%27 cy=%2742%27 rx=%2713%27 ry=%2710.5%27/><ellipse cx=%2714%27 cy=%2728%27 rx=%275.5%27 ry=%277%27/><ellipse cx=%2726%27 cy=%2720%27 rx=%275.5%27 ry=%277.5%27/><ellipse cx=%2738%27 cy=%2720%27 rx=%275.5%27 ry=%277.5%27/><ellipse cx=%2750%27 cy=%2728%27 rx=%275.5%27 ry=%277%27/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>
<div class="wrap"><div id="page"><p class="muted"><span class="spin"></span> 載入中…</p></div></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
const params = new URLSearchParams(location.search);
const SESSION_ID = params.get('session') || '';
let EDIT_CODE = params.get('edit') || '';

/* 這台裝置上次在這個團留下的東西：選到一半的購物車，或已經送出的訂單編號。
   如果網址沒帶 edit，但本機記得訂單編號，就直接用它跟後端要那筆訂單， */
/* 這樣同事重開連結會回到「修改模式」，而不是重點一次。 */
const DRAFT = loadCartDraft(SESSION_ID);
if (!EDIT_CODE && DRAFT && DRAFT.orderCode) EDIT_CODE = DRAFT.orderCode;

let MENU = [], SESSION = null, SETTINGS = {}, cart = [];
/* 已經送出過的訂單預設是鎖起來的唯讀畫面，要按「編輯我的餐點」才能真的
   改品項；ORDER_LOCKED 控制這個狀態，LAST_EXISTING 記著伺服器上目前
   的版本，取消編輯時拿來還原，不會留下改一半又反悔的髒資料。 */
let ORDER_LOCKED = false, LAST_EXISTING = [];
const page = document.getElementById('page');
document.getElementById('top').innerHTML = renderHeroTopbar();

if (!SESSION_ID) {
  page.innerHTML = centerMsg('找不到這個揪團', '連結裡沒有揪團編號，跟主揪要一次正確的點餐連結吧。');
} else {
  apiGet('getOrderPageData', { session: SESSION_ID, edit: EDIT_CODE })
    .then(function (res) {
      SESSION = res.session; MENU = res.menu; SETTINGS = res.settings || {};
      if (!SESSION) {
        page.innerHTML = centerMsg('找不到這個揪團', '連結可能有誤，或這團已經被刪掉了。');
        return;
      }
      render(res.existingOrder || []);
    })
    .catch(function (err) {
      page.innerHTML = centerMsg('載入失敗', err.message || String(err));
    });
}

function render(existing) {
  const left = timeLeft(SESSION.deadline);
  const closed = SESSION.status !== '收單中' || !left;

  /* 如果這台裝置就是開這團的主揪（localStorage 裡找得到管理權杖——
     建團當下就會存進去），加一顆「回到管理頁面」的捷徑，點完餐不用
     再回頭翻信件找管理連結。只有主揪自己的裝置查得到，同事點同一
     個點餐連結不會看到這顆按鈕。 */
  const myGroup = loadMyGroups().filter(function (g) { return g.id === SESSION_ID; })[0];
  /* 放在頁面最下面，不是最上面——主揪自己點完餐、一路往下滑到底，
     順順接著點這顆回管理頁，不用先點餐又要滑回最上面找連結。 */
  const adminLinkHtml = myGroup
    ? '<a class="btn btn-ghost btn-block" href="admin.html?session=' + encodeURIComponent(SESSION_ID) + '&admin=' + encodeURIComponent(myGroup.token) + '" style="display:block;text-align:center;text-decoration:none;margin-top:14px;">← 回到管理頁面</a>'
    : '';

  let html =
    '<h1>' + escapeHtml(SESSION.organizer) + ' 揪的團 🐾</h1>' +

    /* 店家的行銷文案，讓第一次點開連結的同事也知道這是什麼、為什麼要點。
       文字是店家原本就在用的社群貼文內容，照樣搬過來，不用改寫。 */
    '<div class="card promo-card">' +
      '<p class="promo-lead">嗷嗷待哺的你們，吃膩便當了嗎？<br>今天來吃點不一樣的吧！</p>' +
      '<p>不管是早午餐、午餐，還是下午想喝一波飲料<br>' +
        '不用再訂貴貴的外送平台啦！<br>' +
        '嗷嗷直接用店內價，幫你們送到辦公室☺️</p>' +
      '<div class="card-head" style="margin-top:16px;"><span class="dot"></span><h2>🍔 外送規則 🍕</h2></div>' +
      '<div class="promo-rules">' +
        '<div>⭐ 距離店面 3 公里內（Google 搜尋：嗷嗷早午餐 → 路線規劃 → 你的位置）</div>' +
        '<div>⭐ 訂單須滿 1000 元</div>' +
        '<div>⭐ 最晚於前一日 15:00 前下單</div>' +
        '<div>⭐ 外送只能收現金，無法刷卡喔！</div>' +
        '<div>⭐ 外送不適用店內活動、無法使用招待券、折價券</div>' +
        '<div>⭐ 經通話確認後才算訂購成功！</div>' +
      '</div>' +
    '</div>' +

    '<div class="card summary" style="padding:14px 18px;">' +
      '<dl style="margin:0;">' +
        row('取餐方式', SESSION.fulfillment) +
        row('預訂日期', fmtDate(SESSION.deliveryDate) + '　' + escapeHtml(SESSION.deliveryTime || '')) +
        row('收單截止', closed ? '已截止' : fmtDateTime(SESSION.deadline) + '　<span class="countdown">還有 ' + left + '</span>') +
      '</dl>' +
    '</div>';

  if (closed) {
    clearCartDraft(SESSION_ID);
    html += '<div class="notice notice-warn"><span class="ico">⏰</span><div><strong>這團已經截止收單了</strong><br>' +
      '沒辦法再送出或修改訂單，有需要的話直接找主揪 ' + escapeHtml(SESSION.organizer) + ' 喬。</div></div>' +
      adminLinkHtml + renderFoot();
    page.innerHTML = html;
    return;
  }

  html += '<div id="topNotice"></div>';
  html += '<div id="lockBanner"></div>';
  html += '<div class="fab-stack has-cartbar">' + menuButton() + '</div>';

  const cats = [];
  MENU.forEach(function (m) { if (cats.indexOf(m.category) < 0) cats.push(m.category); });

  /* 主欄（菜單）＋ 側欄（購物車、姓名、送出）
     桌機是左右雙欄、手機自然堆疊成上下 */
  html +=
    '<div class="layout">' +
      '<main class="col-main">' +
        chipnavHtml(cats) +
        '<div id="menuArea"></div>' +
      '</main>' +
      '<aside class="col-side">' +
        '<div class="card" id="cartCard">' +
          '<div class="card-head"><span class="dot"></span><h2>你點的東西</h2><span class="spacer"></span>' +
            '<span class="tiny" id="cartHint"></span>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="editToggleBtn" hidden></button></div>' +
          '<div id="cartList"></div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-head"><span class="dot"></span><h2>留個名字讓主揪對得到</h2></div>' +
          '<div class="field" style="margin-bottom:0;"><label for="name">姓名或分機 <span class="req">*</span></label>' +
            '<input type="text" id="name" placeholder="例如 Aaron（3樓）"></div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-head"><span class="dot"></span><h2>寄一份明細到信箱</h2></div>' +
          '<div class="field" style="margin-bottom:0;"><label for="notifyEmail">通知信箱</label>' +
            '<input type="email" id="notifyEmail" placeholder="選填，之後改單或取消也會補寄一份">' +
            '<div class="tiny" style="margin-top:5px;">信裡會附上寄送時間，如果收到好幾封，時間最新的才是目前正確的版本。</div></div>' +
        '</div>' +
        '<button class="btn btn-primary btn-block side-submit" data-submit>送出訂單</button>' +
        '<div id="msgArea"></div>' +
        adminLinkHtml +
      '</aside>' +
    '</div>' +
    renderFoot() +
    '<div class="cartbar">' +
      '<div class="cartbar-info" id="barInfo" style="cursor:pointer;" title="看看點了什麼">' +
        '<div class="cartbar-count" id="barCount">還沒選東西</div>' +
        '<div class="cartbar-total">$<span id="barTotal">0</span></div></div>' +
      '<button class="btn btn-primary" data-submit>送出訂單</button>' +
    '</div>';

  page.innerHTML = html;
  buildMenu(cats);

  document.getElementById('barInfo').addEventListener('click', function () {
    document.getElementById('cartCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  if (EDIT_CODE && existing.length) {
    /* 已經送出過：以伺服器上的內容為準。預設鎖起來當唯讀畫面看，
       不能手滑改到或刪到，要按「編輯我的餐點」才能真的改。 */
    LAST_EXISTING = existing;
    ORDER_LOCKED = true;
    document.getElementById('name').value = existing[0].name;
    document.getElementById('notifyEmail').value = existing[0].notifyEmail || '';
    cart = existing.map(function (o) {
      return { code: o.itemCode, name: o.itemName, size: o.size, opt1: o.opt1, opt2: o.opt2, qty: Number(o.qty), price: Number(o.price), note: o.note || '' };
    });
    if (!params.get('edit')) {
      /* 這筆是靠這台裝置的記憶找回來的，不是從網址帶進來的。
         同事共用一台電腦或平板時可能不是同一個人，所以留一個逃生門。 */
      document.getElementById('topNotice').innerHTML =
        '<div class="notice notice-good"><span class="ico">📝</span><div>' +
          '找到<strong>' + escapeHtml(existing[0].name) + '</strong>先前送出的訂單。' +
          '<div style="margin-top:8px;"><button type="button" class="btn btn-ghost btn-sm" id="notMeBtn">不是我的，我要重點一筆</button></div>' +
        '</div></div>';
      document.getElementById('notMeBtn').addEventListener('click', function () {
        clearCartDraft(SESSION_ID);
        location.href = location.pathname + '?session=' + encodeURIComponent(SESSION_ID);
      });
    }
  } else {
    /* 沒送出過：把選到一半的草稿還原回來 */
    EDIT_CODE = '';
    if (DRAFT) {
      if (DRAFT.name) document.getElementById('name').value = DRAFT.name;
      if (DRAFT.notifyEmail) document.getElementById('notifyEmail').value = DRAFT.notifyEmail;
      if (DRAFT.items && DRAFT.items.length) {
        cart = DRAFT.items;
        document.getElementById('cartHint').textContent = '上次選到一半的';
        document.getElementById('topNotice').innerHTML =
          notice('info', '🐾', '幫你留著上次選到一半的內容，確認一下就可以送出了。');
      }
    }
  }

  /* 姓名、通知信箱改動時也一起存草稿（品項備註在 renderCart 裡已經各自存了） */
  ['name', 'notifyEmail'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', persistDraft);
  });

  updateLockUI();
  document.getElementById('editToggleBtn').addEventListener('click', function () {
    if (ORDER_LOCKED) enterEditMode(); else cancelEditMode();
  });
  submitBtns().forEach(function (b) { b.addEventListener('click', onSubmitClick); });
  setInterval(tickCountdown, 30000);
}

function row(k, v) {
  return '<div class="meta-row"><dt>' + k + '</dt><dd>' + v + '</dd></div>';
}

function chipnavHtml(cats) {
  return '<nav class="chipnav">' + cats.map(function (c, i) {
    return '<a href="#cat' + i + '">' + escapeHtml(c) + '</a>';
  }).join('') + '</nav>';
}

/* 手機的浮動列與桌機側欄各有一顆送出鈕，狀態要一起更新 */
function submitBtns() { return [].slice.call(document.querySelectorAll('[data-submit]')); }
function setSubmit(label, disabled) {
  submitBtns().forEach(function (b) {
    if (label !== null) b.innerHTML = label;
    if (disabled !== null) b.disabled = disabled;
  });
}

/* 手機浮動列跟桌機側欄共用同一顆「送出/確認」按鈕，鎖著的時候按下去
   只是解鎖進入編輯模式，不會真的送出什麼。 */
function onSubmitClick() {
  if (ORDER_LOCKED) { enterEditMode(); return; }
  submit();
}

function enterEditMode() {
  ORDER_LOCKED = false;
  updateLockUI();
}

/** 取消編輯：把姓名、通知信箱、購物車（含每項各自的備註）全部還原成
    伺服器上目前的版本，不留下改一半又反悔的髒資料，重新鎖回唯讀畫面。 */
function cancelEditMode() {
  ORDER_LOCKED = true;
  const first = LAST_EXISTING[0] || {};
  document.getElementById('name').value = first.name || '';
  document.getElementById('notifyEmail').value = first.notifyEmail || '';
  cart = LAST_EXISTING.map(function (o) {
    return { code: o.itemCode, name: o.itemName, size: o.size, opt1: o.opt1, opt2: o.opt2, qty: Number(o.qty), price: Number(o.price), note: o.note || '' };
  });
  updateLockUI();
}

/** 把目前購物車（含每項各自的備註）+ 姓名/通知信箱包成跟 existingOrder
    一樣的形狀，送出成功後拿來當「伺服器上目前版本」的快照（後端不會把
    存好的品項整份回傳，只會回 orderCode）。 */
function snapshotFromCart() {
  const name = document.getElementById('name').value.trim();
  const notifyEmail = document.getElementById('notifyEmail').value.trim();
  return cart.map(function (l) {
    return { itemCode: l.code, itemName: l.name, size: l.size, opt1: l.opt1, opt2: l.opt2, qty: l.qty, price: l.price, name: name, note: l.note || '', notifyEmail: notifyEmail };
  });
}

/** 依 ORDER_LOCKED／是否曾經送出過（EDIT_CODE）決定：
    - 鎖住（已送出、唯讀）：菜單整塊變成不能點，購物車不顯示 × ，
      按鈕變成「編輯我的餐點」。
    - 解鎖但曾經送出過（正在改）：菜單可以點、購物車有 × ，
      按鈕變成「確認修改」，旁邊多一顆「取消修改」。
    - 從來沒送出過（第一次點餐）：完全不鎖，按鈕是「送出訂單」。 */
function updateLockUI() {
  const menuArea = document.getElementById('menuArea');
  const lockBanner = document.getElementById('lockBanner');
  const editBtn = document.getElementById('editToggleBtn');
  const cartHint = document.getElementById('cartHint');
  if (!menuArea || !editBtn) return;

  if (ORDER_LOCKED) {
    menuArea.classList.add('menu-locked');
    lockBanner.innerHTML = notice('info', '🔒', '這是你已經送出的訂單，目前是唯讀畫面。想改品項的話，先按「編輯我的餐點」。');
    editBtn.hidden = false;
    editBtn.textContent = '✏️ 編輯我的餐點';
    cartHint.textContent = '已送出';
    setSubmit('✏️ 編輯我的餐點', false);
  } else if (EDIT_CODE) {
    menuArea.classList.remove('menu-locked');
    lockBanner.innerHTML = '';
    editBtn.hidden = false;
    editBtn.textContent = '↩️ 取消修改';
    cartHint.textContent = '修改模式';
    setSubmit('確認修改', false);
  } else {
    menuArea.classList.remove('menu-locked');
    lockBanner.innerHTML = '';
    editBtn.hidden = true;
    setSubmit('送出訂單', false);
  }
  /* 姓名/通知信箱也算這筆訂單的一部分，鎖著的時候一起唯讀，
     不然按鈕顯示「已送出」，姓名欄卻還能偷偷改，會對不起來。 */
  ['name', 'notifyEmail'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.disabled = ORDER_LOCKED;
  });
  renderCart();
}

function tickCountdown() {
  const el = document.querySelector('.countdown');
  if (!el) return;
  const left = timeLeft(SESSION.deadline);
  if (!left) { location.reload(); return; }
  el.textContent = '還有 ' + left;
}

/* ---------- 菜單 ---------- */

function buildMenu(cats) {
  const area = document.getElementById('menuArea');
  let html = '';
  cats.forEach(function (cat, ci) {
    const items = MENU.filter(function (m) { return m.category === cat; });
    html += '<div class="cat-title" id="cat' + ci + '">' + PAW_MARK +
      escapeHtml(cat) + ' <span class="count">' + items.length + ' 項</span></div>';
    items.forEach(function (m) {
      const idx = MENU.indexOf(m);
      html +=
        '<div class="item" data-i="' + idx + '">' +
          '<div class="item-row">' +
            (m.imageUrl ? '<img class="item-thumb" src="' + escapeHtml(m.imageUrl) + '" alt="' + escapeHtml(m.name) + '" loading="lazy" data-zoomable>' : '') +
            '<div class="item-body">' +
              '<div class="item-name">' + escapeHtml(m.name) + '</div>' +
              tagsHtml(m) +
            '</div>' +
            priceBadge(m) +
          '</div>' +
          '<div class="item-panel"></div>' +
        '</div>';
    });
  });
  area.innerHTML = html;

  area.querySelectorAll('.item-row').forEach(function (rowEl) {
    rowEl.addEventListener('click', function (e) {
      if (e.target.closest('[data-zoomable]')) return; // 點縮圖是要放大看，不是要展開規格
      const item = rowEl.parentElement;
      const wasOpen = item.classList.contains('open');
      area.querySelectorAll('.item.open').forEach(function (o) { o.classList.remove('open'); });
      if (!wasOpen) {
        item.classList.add('open');
        buildPanel(item);
      }
    });
  });
}

/* 「可選醬料」「可選甜度」這種標籤原本每個有規格的品項都會出現，
   但規格本來點開來就看得到、選得到，每項都貼一次反而是雜訊。改成
   只在 note 有特別要講的事（無咖啡因、甜度冰塊固定這種例外情況）
   時才顯示——固定的才是真正需要先讓人知道的資訊。 */
function tagsHtml(m) {
  const tags = [];
  if (m.note) {
    const cls = m.note.indexOf('無咖啡因') >= 0 ? 'tag tag-leaf'
      : (m.note.indexOf('固定') >= 0 ? 'tag tag-berry' : 'tag');
    tags.push('<span class="' + cls + '">' + escapeHtml(m.note) + '</span>');
  }
  if (m.category === '飲料' && !m.priceL) tags.push('<span class="tag">僅中杯</span>');
  return tags.length ? '<div class="item-tags">' + tags.join('') + '</div>' : '';
}

function priceBadge(m) {
  if (m.priceL) {
    return '<div class="price-badge"><span class="p-dual">M $' + m.priceM + '</span>' +
      '<span class="p-dual">L $' + m.priceL + '</span></div>';
  }
  return '<div class="price-badge"><span class="p">$' + m.priceM + '</span></div>';
}

function buildPanel(item) {
  const m = MENU[Number(item.dataset.i)];
  const panel = item.querySelector('.item-panel');
  const state = { size: m.priceL ? 'M' : '', opt1: m.opt1Choices[0] || '', opt2: m.opt2Choices[0] || '', qty: 1 };

  let html = '';
  if (m.priceL) html += group('杯型', ['M', 'L'], state.size, 'size');
  if (m.opt1Name) html += group(m.opt1Name, m.opt1Choices, state.opt1, 'opt1');
  if (m.opt2Name) html += group(m.opt2Name, m.opt2Choices, state.opt2, 'opt2');

  /* 每個品項自己的備註，不是整張訂單共用一句——同一份訂單裡，
     這杯要少冰、那份要不要蔥，各自分開記，送單信跟兩邊後台都會
     照這個品項各別顯示。 */
  html += '<div class="field" style="margin:10px 0 0;">' +
    '<label style="font-size:12px;">這項的備註</label>' +
    '<input type="text" data-note placeholder="選填，例如少冰、不要香菜">' +
    '</div>';

  html +=
    '<div class="panel-foot">' +
      '<div class="stepper"><button type="button" data-step="-1">−</button>' +
      '<span class="qty">1</span><button type="button" data-step="1">+</button></div>' +
      '<button type="button" class="btn btn-primary btn-sm" style="flex:1;" data-add>加入　$<span data-sum>' +
      (m.priceM) + '</span></button>' +
    '</div>';

  panel.innerHTML = html;

  function unitPrice() { return (state.size === 'L' && m.priceL) ? m.priceL : m.priceM; }
  function refresh() {
    panel.querySelector('.qty').textContent = state.qty;
    panel.querySelector('[data-sum]').textContent = unitPrice() * state.qty;
  }

  panel.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      const key = chip.dataset.key;
      state[key] = chip.dataset.val;
      panel.querySelectorAll('.chip[data-key="' + key + '"]').forEach(function (c) { c.classList.remove('on'); });
      chip.classList.add('on');
      refresh();
    });
  });

  panel.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.qty = Math.max(1, state.qty + Number(b.dataset.step));
      refresh();
    });
  });

  panel.querySelector('[data-add]').addEventListener('click', function () {
    const note = panel.querySelector('[data-note]').value.trim();
    addToCart({ code: m.code, name: m.name, size: state.size, opt1: state.opt1, opt2: state.opt2, qty: state.qty, price: unitPrice(), note: note });
    item.classList.remove('open');
  });
}

function group(label, choices, selected, key) {
  return '<div class="optgroup"><div class="optgroup-label">' + escapeHtml(label) + '</div><div class="chips">' +
    choices.map(function (c) {
      return '<button type="button" class="chip' + (c === selected ? ' on' : '') +
        '" data-key="' + key + '" data-val="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
    }).join('') + '</div></div>';
}

/* ---------- 購物車 ---------- */

function addToCart(line) {
  /* 備註不一樣就不合併，不然備註會被吃掉、只留其中一份的字 */
  const same = cart.filter(function (l) {
    return l.code === line.code && l.size === line.size && l.opt1 === line.opt1 && l.opt2 === line.opt2 && (l.note || '') === (line.note || '');
  })[0];
  if (same) same.qty += line.qty; else cart.push(line);
  renderCart();
  const bar = document.querySelector('.cartbar');
  bar.style.transform = 'translateX(-50%) scale(1.03)';
  setTimeout(function () { bar.style.transform = 'translateX(-50%)'; }, 160);
}

function renderCart() {
  const list = document.getElementById('cartList');
  if (!cart.length) {
    list.innerHTML = '<div class="empty">' + PAW_MARK + '<div>還沒加入任何東西<br><span class="tiny">點上面的品項就能選規格</span></div></div>';
  } else {
    list.innerHTML = cart.map(function (l, i) {
      const spec = [l.size, l.opt1, l.opt2].filter(Boolean).join('・');
      return '<div class="cart-line">' +
        '<div class="cart-line-body"><div class="cart-line-name">' + escapeHtml(l.name) +
        ' <span class="num">×' + l.qty + '</span></div>' +
        (spec ? '<div class="cart-line-spec">' + escapeHtml(spec) + '</div>' : '') +
        (ORDER_LOCKED
          ? (l.note ? '<div class="cart-line-spec tiny">※' + escapeHtml(l.note) + '</div>' : '')
          : '<input type="text" class="cart-line-note" data-note-i="' + i + '" placeholder="這項的備註（選填）" value="' + escapeHtml(l.note || '') + '">') +
        '</div>' +
        '<div class="cart-line-price">$' + (l.price * l.qty) + '</div>' +
        (ORDER_LOCKED ? '' : '<button class="cart-x" data-rm="' + i + '" aria-label="移除">×</button>') + '</div>';
    }).join('');
    list.querySelectorAll('[data-rm]').forEach(function (b) {
      b.addEventListener('click', function () { cart.splice(Number(b.dataset.rm), 1); renderCart(); });
    });
    list.querySelectorAll('[data-note-i]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        cart[Number(inp.dataset.noteI)].note = inp.value.trim();
        persistDraft();
      });
    });
  }
  const total = cart.reduce(function (s, l) { return s + l.price * l.qty; }, 0);
  const count = cart.reduce(function (s, l) { return s + l.qty; }, 0);
  persistDraft();

  /* 桌機看不到底部浮動列，所以小計要顯示在購物車卡片裡 */
  if (cart.length) {
    list.insertAdjacentHTML('beforeend',
      '<div class="cart-total"><span>共 ' + count + ' 份</span>' +
      '<span class="amount">$' + total + '</span></div>');
  }

  document.getElementById('barTotal').textContent = total;
  document.getElementById('barCount').textContent = count ? ('共 ' + count + ' 份') : '還沒選東西';
}

/** 把目前的購物車、姓名、備註、通知信箱存回這台裝置 */
function persistDraft() {
  const nameEl = document.getElementById('name');
  if (!nameEl) return;
  saveCartDraft(SESSION_ID, {
    items: cart,
    name: nameEl.value,
    notifyEmail: document.getElementById('notifyEmail').value,
    orderCode: EDIT_CODE || ''
  });
}

/* ---------- 送出 ---------- */

function submit() {
  const name = document.getElementById('name').value.trim();
  const msgArea = document.getElementById('msgArea');
  if (!name) {
    document.getElementById('name').focus();
    msgArea.innerHTML = notice('warn', '⚠️', '還沒填姓名，主揪會不知道這是誰點的。');
    return;
  }
  if (!cart.length) {
    msgArea.innerHTML = notice('warn', '⚠️', '購物車是空的，先挑點東西吧。');
    return;
  }

  const notifyEmail = document.getElementById('notifyEmail').value.trim();
  const items = cart.map(function (l) { return Object.assign({}, l, { note: l.note || '' }); });

  setSubmit('<span class="spin"></span> 送出中…', true);
  msgArea.innerHTML = '';

  apiPost(EDIT_CODE ? 'updateOrder' : 'submitOrder', {
    sessionId: SESSION_ID, name: name, items: items, orderCode: EDIT_CODE,
    notifyEmail: notifyEmail, baseUrl: location.href.replace(/[^/]*(\?.*)?$/, '')
  }).then(function (res) {
    EDIT_CODE = res.orderCode;
    persistDraft();
    const topNotice = document.getElementById('topNotice');
    if (topNotice) topNotice.innerHTML = '';
    const editUrl = location.origin + location.pathname + '?session=' + SESSION_ID + '&edit=' + EDIT_CODE;
    msgArea.innerHTML =
      '<div class="card" style="border-color:var(--leaf);">' +
        '<div class="card-head"><span class="dot" style="background:var(--leaf);"></span><h2>訂單送出了 ✅</h2></div>' +
        '<p class="muted">截止前想改或想取消，回到這個專屬連結就可以：</p>' +
        linkBox(editUrl, 'editUrl') +
        (notifyEmail
          ? '<div class="notice notice-good" style="margin-top:10px;"><span class="ico">📧</span><div>已經寄一份明細到 <strong>' +
            escapeHtml(notifyEmail) + '</strong>，之後改單或取消也會補寄一份，信裡的寄送時間就是版本依據。</div></div>'
          : '') +
        '<button class="btn btn-danger btn-block btn-sm" style="margin-top:12px;" id="cancelBtn">取消這筆訂單</button>' +
      '</div>';
    /* 存成功了，重新鎖回唯讀畫面，避免存完又手滑改到、卻忘記再按一次確認。 */
    ORDER_LOCKED = true;
    LAST_EXISTING = snapshotFromCart();
    updateLockUI();
    document.getElementById('cancelBtn').addEventListener('click', cancelOrder);
    msgArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }).catch(function (err) {
    msgArea.innerHTML = notice('warn', '⚠️', err.message || String(err));
    updateLockUI();
  });
}

function cancelOrder() {
  if (!confirm('確定要取消這筆訂單嗎？')) return;
  const btn = document.getElementById('cancelBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 取消中…'; }
  const notifyEmail = document.getElementById('notifyEmail').value.trim();
  apiPost('cancelOrder', { sessionId: SESSION_ID, orderCode: EDIT_CODE }).then(function () {
    clearCartDraft(SESSION_ID);
    /* 取消後留在點餐頁，只是購物車清空——不要整頁跳走，同事想重點的話直接選就好。 */
    EDIT_CODE = '';
    ORDER_LOCKED = false;
    cart = [];
    updateLockUI();
    const topNotice = document.getElementById('topNotice');
    if (topNotice) topNotice.innerHTML = '';
    document.getElementById('msgArea').innerHTML = notice('good', '✅', '訂單已取消，購物車也清空了。' +
      (notifyEmail ? '取消確認信也補寄到 ' + notifyEmail + ' 了。' : '') + '想重新點餐的話，直接選就可以。');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }).catch(function (err) {
    alert(err.message || String(err));
    if (btn) { btn.disabled = false; btn.textContent = '取消這筆訂單'; }
  });
}

function notice(kind, ico, text) {
  return '<div class="notice notice-' + kind + '"><span class="ico">' + ico + '</span><div>' + escapeHtml(text) + '</div></div>';
}
</script>
