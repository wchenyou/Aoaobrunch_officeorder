<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店家後台｜嗷嗷早午餐</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><rect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23F08A24%27/><g fill=%27white%27><ellipse cx=%2732%27 cy=%2742%27 rx=%2713%27 ry=%2710.5%27/><ellipse cx=%2714%27 cy=%2728%27 rx=%275.5%27 ry=%277%27/><ellipse cx=%2726%27 cy=%2720%27 rx=%275.5%27 ry=%277.5%27/><ellipse cx=%2738%27 cy=%2720%27 rx=%275.5%27 ry=%277.5%27/><ellipse cx=%2750%27 cy=%2728%27 rx=%275.5%27 ry=%277%27/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>
<div class="wrap"><div id="page"></div></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
document.getElementById('top').innerHTML = renderTopbar('店家後台');
const page = document.getElementById('page');

/* 密碼只存在這台裝置，登入一次之後不用每次都輸入。
   密碼本身是「設定」表裡的「店家後台密碼」，店家想換密碼直接在
   Supabase 後台改那一格就好，不用找人改程式碼。 */
const PW_KEY = 'aoao_vendor_pw';
let PASSWORD = '';
try { PASSWORD = localStorage.getItem(PW_KEY) || ''; } catch (e) { /* 無痕模式 */ }

/* 新訂單瀏覽器推播（Web Push）用的公鑰，登入時後端會一起回傳；
   沒設定的話是空字串，畫面上就不會出現「開啟通知」按鈕。 */
let VAPID_PUBLIC_KEY = '';
let swRegistration = null;

/* 依日期查詢那頁存最後一次查到的結果，CSV 匯出要用 */
let HISTORY_SESSIONS = [];
let historyLoadedOnce = false;

if (PASSWORD) {
  tryLoad(PASSWORD, true);
} else {
  renderLogin();
}

function renderLogin(errMsg) {
  page.innerHTML =
    '<h1>店家後台 🐾</h1>' +
    '<p class="muted">看目前收到的訂單、標記已經出餐完成的團，還可以匯出一段期間的訂單資料。</p>' +
    '<div class="card narrow" style="max-width:420px;">' +
      '<div class="card-head"><span class="dot"></span><h2>請輸入密碼</h2></div>' +
      (errMsg ? '<div class="notice notice-warn" style="margin-bottom:12px;"><span class="ico">⚠️</span><div>' + escapeHtml(errMsg) + '</div></div>' : '') +
      '<div class="field"><label for="pw">密碼</label><input type="password" id="pw" placeholder="向系統管理者索取"></div>' +
      '<button type="button" class="btn btn-primary btn-block" id="loginBtn">登入</button>' +
    '</div>';
  document.getElementById('pw').focus();
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
}

function doLogin() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 確認中…';
  tryLoad(pw, false);
}

/** silent=true 是「這台裝置記住的密碼，先默默試試看」，錯了就默默退回登入畫面，不嚇到人 */
function tryLoad(pw, silent) {
  apiPost('vendorLogin', { password: pw }).then(function (res) {
    PASSWORD = pw;
    VAPID_PUBLIC_KEY = res.vapidPublicKey || '';
    try { localStorage.setItem(PW_KEY, pw); } catch (e) { /* 略過 */ }
    renderShell();
  }).catch(function (err) {
    try { localStorage.removeItem(PW_KEY); } catch (e) { /* 略過 */ }
    if (!silent) renderLogin(err.message || '密碼不正確');
    else renderLogin();
  });
}

function logout() {
  try { localStorage.removeItem(PW_KEY); } catch (e) { /* 略過 */ }
  PASSWORD = '';
  historyLoadedOnce = false;
  renderLogin();
}

/* ---------- 主畫面：分兩頁——待處理訂單、依日期查詢 ---------- */

function todayStr(offsetDays) {
  const d = new Date(Date.now() + (offsetDays || 0) * 86400000);
  return d.toISOString().slice(0, 10);
}

function renderShell() {
  page.innerHTML =
    '<h1>店家後台 🐾</h1>' +
    '<div class="vendor-topbar">' +
      '<div class="seg">' +
        '<input type="radio" name="vtab" id="vtabPending" checked><label for="vtabPending">📥 待處理訂單</label>' +
        '<input type="radio" name="vtab" id="vtabHistory"><label for="vtabHistory">🔍 依日期查詢</label>' +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" id="logoutBtn">登出</button>' +
    '</div>' +

    /* 這是一個「設定」，跟上面分頁列（待處理／依日期查詢）或登出不是
       同一類東西，硬塞在同一列會看起來很突兀，所以獨立成自己的一張
       卡片，標籤／說明／開關放在一起，意思才清楚。VAPID 金鑰沒設定
       時這張卡片整個不會出現（見 initPushUI）。 */
    '<div class="card" id="pushCard" hidden style="padding:14px 18px;">' +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
        '<div style="flex:1;min-width:200px;">' +
          '<strong>🔔 新訂單通知</strong>' +
          '<div class="tiny" id="pushHint" style="margin-top:2px;">有新訂單送來時，這台裝置會跳系統通知。</div>' +
        '</div>' +
        '<button class="btn btn-ghost btn-sm" id="pushToggleBtn"></button>' +
      '</div>' +
    '</div>' +

    '<div id="pendingPanel"></div>' +
    '<div id="historyPanel" hidden></div>';

  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('vtabPending').addEventListener('change', showPending);
  document.getElementById('vtabHistory').addEventListener('change', showHistory);

  renderPendingShell();
  renderHistoryShell();
  loadPending();
  initPushUI();
}

/* ---------- 新訂單瀏覽器推播（Web Push） ----------
   按鈕只有三種狀態：沒開通知／通知已開啟／被瀏覽器封鎖。請求通知權限
   一定要是使用者自己按按鈕才能觸發（瀏覽器規定，也比較不會被當成
   騷擾式彈窗），所以 initPushUI() 只負責畫出目前狀態，不會自動跳出
   權限請求視窗。 */

function initPushUI() {
  const card = document.getElementById('pushCard');
  const hint = document.getElementById('pushHint');
  if (!card) return;

  if (!VAPID_PUBLIC_KEY) return; // 後端還沒設定 VAPID 金鑰，功能還沒開放，整張卡片都不出現
  card.hidden = false;

  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    hint.textContent = '📱 這個瀏覽器目前不支援通知（iPhone 的話，要先把這個網址加到主畫面才能用）。';
    document.getElementById('pushToggleBtn').hidden = true;
    return;
  }

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    swRegistration = reg;
    return reg.pushManager.getSubscription();
  }).then(function (sub) {
    paintPushBtn(!!sub);
  }).catch(function (err) {
    console.log('推播初始化失敗：', err);
    hint.textContent = '這台裝置目前沒辦法開啟通知。';
    document.getElementById('pushToggleBtn').hidden = true;
  });
}

function paintPushBtn(subscribed) {
  const btn = document.getElementById('pushToggleBtn');
  const hint = document.getElementById('pushHint');
  btn.hidden = false;
  btn.disabled = false;
  btn.style.borderColor = '';
  btn.style.color = '';

  if (Notification.permission === 'denied') {
    btn.textContent = '🔕 已封鎖';
    btn.disabled = true;
    hint.textContent = '通知被瀏覽器擋掉了，要重新開啟的話，去瀏覽器的「網站設定」把這個網址的通知權限打開。';
    return;
  }
  if (subscribed) {
    btn.textContent = '🔔 通知已開啟';
    btn.style.borderColor = 'var(--leaf)';
    btn.style.color = 'var(--leaf)';
    btn.title = '點一下可以關閉';
    hint.textContent = '這台裝置有新訂單送來時會跳系統通知。';
    btn.onclick = disablePush;
  } else {
    btn.textContent = '開啟';
    btn.title = '';
    hint.textContent = '有新訂單送來時，這台裝置會跳系統通知。';
    btn.onclick = enablePush;
  }
}

function enablePush() {
  const btn = document.getElementById('pushToggleBtn');
  btn.disabled = true; btn.textContent = '開啟中…';
  swRegistration.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  }).then(function (sub) {
    return apiPost('vendorSubscribePush', { password: PASSWORD, subscription: sub.toJSON() });
  }).then(function () {
    paintPushBtn(true);
  }).catch(function (err) {
    alert('開啟通知失敗：' + (err.message || String(err)));
    paintPushBtn(false);
  });
}

function disablePush() {
  const btn = document.getElementById('pushToggleBtn');
  btn.disabled = true; btn.textContent = '關閉中…';
  swRegistration.pushManager.getSubscription().then(function (sub) {
    if (!sub) { paintPushBtn(false); return; }
    const endpoint = sub.endpoint;
    return sub.unsubscribe().then(function () {
      return apiPost('vendorUnsubscribePush', { password: PASSWORD, endpoint: endpoint });
    });
  }).then(function () {
    paintPushBtn(false);
  }).catch(function (err) {
    alert('關閉通知失敗：' + (err.message || String(err)));
    paintPushBtn(true);
  });
}

/** VAPID 公鑰是 base64url 字串，瀏覽器的 subscribe() 要吃 Uint8Array，中間要轉一手。
 *  這是 Web Push 的標準轉換寫法，網路上到處找得到同一份。 */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function showPending() {
  document.getElementById('pendingPanel').hidden = false;
  document.getElementById('historyPanel').hidden = true;
}
function showHistory() {
  document.getElementById('pendingPanel').hidden = true;
  document.getElementById('historyPanel').hidden = false;
  if (!historyLoadedOnce) { historyLoadedOnce = true; loadHistory(); }
}

/* ---------- 待處理訂單：已送單、還沒標記完成的團——不用選日期，
   這就是店家現在該準備的東西。 ---------- */

function renderPendingShell() {
  const el = document.getElementById('pendingPanel');
  el.innerHTML =
    '<div class="section-head">' +
      '<h2>📥 待處理訂單</h2>' +
      '<span class="tiny">已經送單、但還沒標記完成的團，不限日期，全部都在這裡</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-ghost btn-sm" id="pendingRefreshBtn">重新整理</button>' +
    '</div>' +
    '<div id="pendingList"></div>';
  document.getElementById('pendingRefreshBtn').addEventListener('click', loadPending);
}

function loadPending() {
  const list = document.getElementById('pendingList');
  list.innerHTML = '<p class="muted"><span class="spin"></span> 載入中…</p>';
  apiPost('vendorOrders', { password: PASSWORD, vendorDone: false }).then(function (res) {
    renderOrderCards(list, res.sessions || [], '目前沒有待處理的訂單', loadPending);
  }).catch(function (err) {
    list.innerHTML = '<div class="notice notice-warn"><span class="ico">⚠️</span><div>' + escapeHtml(err.message || String(err)) + '</div></div>';
  });
}

/* ---------- 依日期查詢：自己選區間跟狀態，可以匯出 CSV ---------- */

function renderHistoryShell() {
  const el = document.getElementById('historyPanel');
  el.innerHTML =
    '<div class="card">' +
      '<div class="card-head"><span class="dot"></span><h2>篩選條件</h2></div>' +
      '<div class="grid-2">' +
        '<div class="field"><label for="dateFrom">預訂日期從</label><input type="date" id="dateFrom" value="' + todayStr(-30) + '"></div>' +
        '<div class="field"><label for="dateTo">到</label><input type="date" id="dateTo" value="' + todayStr(30) + '"></div>' +
      '</div>' +
      '<div class="field"><label for="statusFilter">完成狀態</label>' +
        '<select id="statusFilter">' +
          '<option value="">全部</option>' +
          '<option value="false">尚未完成</option>' +
          '<option value="true">已完成</option>' +
        '</select></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        '<button class="btn btn-primary" id="queryBtn" style="flex:1;min-width:120px;">查詢</button>' +
        '<button class="btn btn-ghost" id="exportBtn" style="flex:1;min-width:120px;">⬇️ 下載 CSV</button>' +
      '</div>' +
    '</div>' +
    '<div class="section-head"><h2>查詢結果</h2></div>' +
    '<div id="historyList"></div>';

  document.getElementById('queryBtn').addEventListener('click', loadHistory);
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
}

function loadHistory() {
  const list = document.getElementById('historyList');
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const statusVal = document.getElementById('statusFilter').value; // '', 'false', 'true'
  list.innerHTML = '<p class="muted"><span class="spin"></span> 載入中…</p>';

  apiPost('vendorOrders', {
    password: PASSWORD, dateFrom: dateFrom, dateTo: dateTo,
    vendorDone: statusVal === '' ? undefined : (statusVal === 'true')
  }).then(function (res) {
    HISTORY_SESSIONS = res.sessions || [];
    renderOrderCards(list, HISTORY_SESSIONS, '這段期間沒有符合條件的團', loadHistory);
  }).catch(function (err) {
    list.innerHTML = '<div class="notice notice-warn"><span class="ico">⚠️</span><div>' + escapeHtml(err.message || String(err)) + '</div></div>';
  });
}

/* ---------- 兩頁共用的訂單卡片（依品項彙總，不含跟團者姓名） ---------- */

function renderOrderCards(container, sessions, emptyText, onReload) {
  if (!sessions.length) {
    container.innerHTML = '<div class="empty">' + PAW_MARK + '<div>' + escapeHtml(emptyText) + '</div></div>';
    return;
  }
  container.innerHTML = sessions.map(function (s) {
    const done = s.vendorDone === true;
    const badge = done ? '<span class="badge done">已完成</span>' : '<span class="badge warn">已送單</span>';
    return (
      '<div class="card">' +
        '<div class="card-head"><span class="dot"></span><h2>' + escapeHtml(fmtDate(s.deliveryDate)) + '　' + escapeHtml(s.company || s.organizer) + '</h2>' +
          '<span class="spacer"></span>' + badge + '</div>' +
        '<div class="tiny" style="margin-bottom:10px;">' + escapeHtml(s.fulfillment) + (s.fulfillment === '外送' ? '　' + escapeHtml(s.address || '') : '') +
          '　期望送達 ' + escapeHtml(s.deliveryTime || '') + '</div>' +
        '<dl style="margin:0 0 12px;">' +
          s.items.map(function (it) {
            const specs = [it.size, it.opt1, it.opt2].filter(Boolean).join('／');
            return '<div class="meta-row"><dt>' + escapeHtml(it.itemName) + (specs ? '（' + escapeHtml(specs) + '）' : '') + '</dt>' +
              '<dd>×' + it.qty + '　$' + it.subtotal + '</dd></div>';
          }).join('') +
        '</dl>' +
        '<div class="order-card-foot">' +
          '<span class="label">總計</span><span class="amount">$' + s.total + '</span>' +
          (done ? '' : '<button type="button" class="btn btn-primary btn-lg" data-complete="' + escapeHtml(s.id) + '">✅ 標記完成</button>') +
        '</div>' +
      '</div>'
    );
  }).join('');

  container.querySelectorAll('[data-complete]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!confirm('確定要標記這團已完成嗎？')) return;
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 標記中…';
      apiPost('vendorComplete', { password: PASSWORD, sessionId: btn.dataset.complete }).then(function () {
        onReload();
      }).catch(function (err) {
        alert(err.message || String(err));
        btn.disabled = false; btn.textContent = '✅ 標記完成';
      });
    });
  });
}

function fmtDate(s) {
  return String(s || '').replace(/-/g, '/');
}

/* ---------- 匯出 CSV（依日期查詢那頁的資料，品項彙總，不含跟團者姓名） ---------- */

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCsv() {
  if (!HISTORY_SESSIONS.length) { alert('目前沒有資料可以匯出，先查詢一次看看。'); return; }
  const header = ['揪團編號', '預訂日期', '公司／主揪', '取餐方式', '狀態', '品項名稱', '規格', '數量', '小計'];
  const rows = [header];
  HISTORY_SESSIONS.forEach(function (s) {
    s.items.forEach(function (it) {
      const specs = [it.size, it.opt1, it.opt2].filter(Boolean).join('／');
      rows.push([s.id, fmtDate(s.deliveryDate), s.company || s.organizer, s.fulfillment, (s.vendorDone ? '已完成' : '尚未完成'), it.itemName, specs, it.qty, it.subtotal]);
    });
  });
  const csv = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '嗷嗷團購訂單_' + document.getElementById('dateFrom').value + '_' + document.getElementById('dateTo').value + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
