<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>發起團購｜嗷嗷早午餐</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><rect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23F08A24%27/><g fill=%27white%27><ellipse cx=%2732%27 cy=%2742%27 rx=%2713%27 ry=%2710.5%27/><ellipse cx=%2714%27 cy=%2728%27 rx=%275.5%27 ry=%277%27/><ellipse cx=%2726%27 cy=%2720%27 rx=%275.5%27 ry=%277.5%27/><ellipse cx=%2738%27 cy=%2720%27 rx=%275.5%27 ry=%277.5%27/><ellipse cx=%2750%27 cy=%2728%27 rx=%275.5%27 ry=%277%27/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>

<div class="wrap">
  <div id="page"></div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
document.getElementById('top').innerHTML = renderHeroTopbar();

const page = document.getElementById('page');

page.innerHTML =
  '<h1 class="page-hero">來揪一團吧 🐾</h1>' +
  '<p class="muted page-hero">填一次訂購資訊，系統會給你兩個連結：一個丟到辦公室群組讓大家點餐，一個你自己留著看訂單、按送單。</p>' +

  '<div class="fab-stack" id="fabStack">' + menuButton() + '</div>' +

  '<div class="notice notice-info" id="rules"><span class="ico">📌</span><div>載入店家規定中…</div></div>' +

  '<form id="form"><div class="form-grid">' +

    '<div class="card" id="cardWho">' +
      '<div class="card-head"><span class="dot"></span><h2>你是誰</h2></div>' +
      '<div class="field"><label for="organizer">主揪姓名 <span class="req">*</span></label>' +
        '<input type="text" id="organizer" placeholder="大家看得懂的稱呼" required></div>' +
      '<div class="field"><label for="organizerEmail">你的 Email <span class="req">*</span></label>' +
        '<input type="email" id="organizerEmail" placeholder="建團後管理連結會寄到這裡" required>' +
        '<div class="tiny" style="margin-top:5px;">建好團會馬上寄一封信給你，裡面有管理連結——之後換手機、清快取都還找得回來。送單時也會副本一份給你對帳。</div></div>' +
      '<div class="field"><span class="field-label">取餐方式 <span class="req">*</span></span>' +
        '<div class="seg">' +
          '<input type="radio" name="fulfillment" id="f1" value="外送" checked><label for="f1">外送到辦公室</label>' +
          '<input type="radio" name="fulfillment" id="f2" value="自取"><label for="f2">自己去取</label>' +
        '</div></div>' +
    '</div>' +

    '<div class="card" id="cardWhen">' +
      '<div class="card-head"><span class="dot"></span><h2>什麼時候要</h2></div>' +
      '<div class="grid-2">' +
        '<div class="field"><label for="deliveryDate">預訂日期 <span class="req">*</span></label>' +
          '<input type="date" id="deliveryDate" required>' +
          '<div class="tiny" style="margin-top:5px;">最早只能選明天，當天無法下單。</div></div>' +
        '<div class="field"><label for="deliveryTime">期望送達時間 <span class="req">*</span></label>' +
          '<input type="text" id="deliveryTime" placeholder="例如 11:30" required></div>' +
      '</div>' +
      '<div class="tiny" style="margin:-6px 0 14px;">平日外送 08:00–15:00、假日 10:00–16:00，誤差半小時內送達。</div>' +

      '<div class="field"><label for="deadline">同事的收單截止時間 <span class="req">*</span></label>' +
        '<input type="datetime-local" id="deadline" required>' +
        '<div class="tiny" id="deadlineHint" style="margin-top:5px;">先選預訂日期，這裡會告訴你最晚可以設到什麼時候。</div></div>' +

      '<div class="field" id="addressField"><label for="address">外送地址 <span class="req">*</span></label>' +
        '<input type="text" id="address" placeholder="請確認在店面 3 公里內"></div>' +

      '<div class="field"><span class="field-label">需要餐具嗎 <span class="req">*</span></span>' +
        '<div class="seg">' +
          '<input type="radio" name="needUtensils" id="u1" value="是" checked><label for="u1">要</label>' +
          '<input type="radio" name="needUtensils" id="u2" value="否"><label for="u2">不用</label>' +
        '</div></div>' +

      '<div class="field" style="margin-bottom:0;"><span class="field-label">若遇颱風假是否取消 <span class="req">*</span></span>' +
        '<div class="seg">' +
          '<input type="radio" name="typhoonCancel" id="t1" value="是" checked><label for="t1">取消</label>' +
          '<input type="radio" name="typhoonCancel" id="t2" value="否"><label for="t2">照送</label>' +
        '</div></div>' +
    '</div>' +

    '<div class="card" id="cardBill">' +
      '<div class="card-head"><span class="dot"></span><h2>發票與聯絡窗口</h2></div>' +
      '<div class="grid-2">' +
        '<div class="field"><label for="company">公司名稱</label>' +
          '<input type="text" id="company" placeholder="選填"></div>' +
        '<div class="field"><label for="taxId">統一編號</label>' +
          '<input type="text" id="taxId" placeholder="選填"></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label for="contactName">聯絡窗口姓名 <span class="req">*</span></label>' +
          '<input type="text" id="contactName" required></div>' +
        '<div class="field"><label for="contactPhone">聯絡窗口電話 <span class="req">*</span></label>' +
          '<input type="tel" id="contactPhone" required></div>' +
      '</div>' +
      '<div class="field"><label for="contactAvailableTime">方便接聽電話的時間 <span class="req">*</span></label>' +
        '<input type="text" id="contactAvailableTime" placeholder="例如 下午 2 點後" required>' +
        '<div class="tiny" style="margin-top:5px;">店家會在前一日或當日致電確認，請務必能接到電話。</div></div>' +
      '<div class="field" style="margin-bottom:0;"><label for="note">想跟店家說的話</label>' +
        '<textarea id="note" placeholder="選填"></textarea></div>' +
    '</div>' +

    '<div class="full">' +
      '<button type="submit" class="btn btn-primary btn-block" id="submitBtn">建立揪團</button>' +
      '<div id="errorMsg"></div>' +
    '</div>' +
  '</div></form>' +

  '<div id="result" class="narrow"></div>' +
  renderFoot();

/* 店家規定 */
apiGet('getMenu').then(function (res) {
  const s = res.settings || {};
  document.querySelector('#rules div').innerHTML =
    '<strong>店家規定</strong>：距離店面 ' + (s['外送範圍公里數'] || 3) + ' 公里內、外送需滿 ' +
    (s['低消金額'] || 1000) + ' 元，而且最晚要在<strong>預訂日期前一天 15:00</strong> 之前完成送單。';
}).catch(function () {
  document.querySelector('#rules div').innerHTML =
    '<strong>店家規定</strong>：外送限 3 公里內、需滿 1000 元，最晚需於預訂日期前一天 15:00 前送單。';
});

/* 外送才需要地址 */
const fulfillmentRadios = [].slice.call(document.getElementsByName('fulfillment'));
const addressField = document.getElementById('addressField');
function syncAddress() {
  const val = fulfillmentRadios.filter(function (r) { return r.checked; })[0].value;
  addressField.style.display = (val === '外送') ? 'block' : 'none';
  document.getElementById('address').required = (val === '外送');
}
fulfillmentRadios.forEach(function (r) { r.addEventListener('change', syncAddress); });
syncAddress();

/* 預訂日期下限：最早只能選明天 */
const dateInput = document.getElementById('deliveryDate');
const deadlineInput = document.getElementById('deadline');
const deadlineHint = document.getElementById('deadlineHint');
function pad(n) { return String(n).padStart(2, '0'); }

(function () {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.getFullYear() + '-' + pad(tomorrow.getMonth() + 1) + '-' + pad(tomorrow.getDate());
})();

/* 截止時間上限：預訂日期前一天 15:00 */
dateInput.addEventListener('change', function () {
  if (!dateInput.value) return;
  const d = new Date(dateInput.value + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  d.setHours(15, 0, 0, 0);
  deadlineInput.max = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  deadlineHint.innerHTML = '最晚可以設到 <strong>' +
    d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) +
    '</strong>，這是店家「最晚前一日 15:00 下單」的規定。';
});

/* 送出 */
document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.innerHTML = '';
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 建立中…';

  function pick(name) {
    return [].slice.call(document.getElementsByName(name)).filter(function (r) { return r.checked; })[0].value;
  }
  function val(id) { return document.getElementById(id).value.trim(); }

  apiPost('createSession', {
    organizer: val('organizer'),
    organizerEmail: val('organizerEmail'),
    fulfillment: pick('fulfillment'),
    deliveryDate: dateInput.value,
    deliveryTime: val('deliveryTime'),
    address: val('address'),
    deadline: deadlineInput.value,
    needUtensils: pick('needUtensils'),
    typhoonCancel: pick('typhoonCancel'),
    company: val('company'),
    taxId: val('taxId'),
    contactName: val('contactName'),
    contactPhone: val('contactPhone'),
    contactAvailableTime: val('contactAvailableTime'),
    note: val('note'),
    baseUrl: location.href.replace(/[^/]*(\?.*)?$/, '')
  }).then(function (res) {
    saveMyGroup({
      id: res.sessionId,
      token: res.adminToken,
      company: val('company'),
      organizer: val('organizer'),
      deliveryDate: dateInput.value,
      deadline: deadlineInput.value,
      status: '收單中'
    });
    const base = location.href.replace(/index\.html(\?.*)?$/, '').replace(/\?.*$/, '');
    const orderUrl = base + 'order.html?session=' + res.sessionId;
    const adminUrl = base + 'admin.html?session=' + res.sessionId + '&admin=' + res.adminToken;

    document.getElementById('form').style.display = 'none';
    document.getElementById('rules').style.display = 'none';
    document.querySelector('#page h1').textContent = '揪團建立好了 🎉';
    document.querySelector('#page > p.muted').textContent = '接下來把點餐連結貼到群組，管理連結自己留著。';

    document.getElementById('result').innerHTML =
      '<div class="card">' +
        '<div class="card-head"><span class="dot"></span><h2>① 分享給同事的點餐連結</h2></div>' +
        linkBox(orderUrl, 'orderUrl') +
        '<div class="tiny" style="margin-top:8px;">同事點開就能看菜單、選餐、送出，截止前也能自己改。</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><span class="dot"></span><h2>② 你的管理連結（請留好）</h2></div>' +
        linkBox(adminUrl, 'adminUrl') +
        '<div class="tiny" style="margin-top:8px;">只有這個連結能看到全部訂單、按下送單。</div>' +
        (res.mailed
          ? '<div class="notice notice-good" style="margin:12px 0 0;"><span class="ico">📧</span><div>已經寄一份到 <strong>' +
            escapeHtml(val('organizerEmail')) + '</strong>，關掉這頁也沒關係。</div></div>'
          : '<div class="notice notice-warn" style="margin:12px 0 0;"><span class="ico">⚠️</span><div>這次沒能寄出通知信，請自己先把上面的管理連結存起來。</div></div>') +
      '</div>' +
      '<a class="btn btn-primary btn-block" style="text-decoration:none;text-align:center;display:block;" href="' + adminUrl + '">前往管理頁面</a>' +
      '<a class="btn btn-ghost btn-block" style="text-decoration:none;text-align:center;display:block;margin-top:10px;" href="' + orderUrl + '">🐾 主揪自己也要點餐</a>';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }).catch(function (err) {
    errorMsg.innerHTML = '<div class="notice notice-warn" style="margin-top:12px;"><span class="ico">⚠️</span><div>' +
      escapeHtml(err.message || String(err)) + '</div></div>';
    btn.disabled = false;
    btn.textContent = '建立揪團';
  });
});
/* ---------- 你開過的團（存在這台裝置的瀏覽器裡） ----------
   跟「查看菜單」一起懸浮在右下角。按鈕本身固定存在，不管有沒有記住
   任何團——沒有的話點開就是空狀態，不會讓按鈕忽有忽無、位置一直跳。
   有幾團就在按鈕右上角用數字角標顯示。 */

renderMyGroups();

function renderMyGroups() {
  const fabStack = document.getElementById('fabStack');

  const toggleBtn = document.createElement('button');
  toggleBtn.type = 'button';
  toggleBtn.id = 'myGroupsToggle';
  toggleBtn.className = 'btn btn-ghost btn-sm';
  toggleBtn.innerHTML = '🐾 你開過的團';
  toggleBtn.addEventListener('click', function () {
    if (document.getElementById('myGroups')) { closeModal(); return; }
    openGroupsModal();
  });
  fabStack.appendChild(toggleBtn);

  function visibleGroups() {
    /* 主揪自己標記完成（結案）的團不用再一直佔位子，這裡只留還需要
       關注的團——跟店家端的出餐進度是各自獨立的旗標，不會互相影響。 */
    return loadMyGroups().filter(function (g) { return g.organizerClosed !== true; });
  }

  /* 這份清單只存在這台裝置的瀏覽器裡（localStorage），不是真的雲端
     備份——清瀏覽器資料、換瀏覽器、換手機都會不見。真正不會不見的
     是建團當下寄到主揪信箱的那封信，裡面有管理連結。放這行警語
     讓主揪自己知道這個風險，不要以為這裡是可靠的紀錄。 */
  const DEVICE_ONLY_WARNING =
    '<div class="notice notice-warn" style="margin:10px 0 0;"><span class="ico">⚠️</span>' +
      '<div>這份清單只存在這台裝置的瀏覽器裡，清除瀏覽資料、換瀏覽器或換手機都會不見。' +
      '真正找得回來的是建團時寄到你信箱的那封信，裡面有管理連結，記得留著。</div></div>';

  function cardHtml(items) {
    if (!items.length) {
      return '<div id="myGroups"><div class="card" style="border-color:var(--peach);">' +
        '<div class="card-head"><span class="dot"></span><h2>你開過的團</h2></div>' +
        '<div class="empty">' + PAW_MARK + '<div>這台裝置還沒有記住任何團<br><span class="tiny">建好團之後會自動記住，方便你之後回來看訂單</span></div></div>' +
        DEVICE_ONLY_WARNING +
      '</div></div>';
    }
    return '<div id="myGroups"><div class="card" style="border-color:var(--peach);">' +
      '<div class="card-head"><span class="dot"></span><h2>你開過的團</h2>' +
        '<span class="spacer"></span><span class="tiny">這台裝置記得的</span></div>' +
        items.map(function (g) {
          const left = g.deadline ? timeLeft(g.deadline) : null;
          const sent = g.status === '已送單';
          const badge = sent
            ? '<span class="badge warn">已送單</span>'
            : (left ? '<span class="badge">開團中</span>' : '<span class="badge warn">已截止</span>');
          const when = g.deliveryDate ? fmtDate(g.deliveryDate) : '';
          return '<div class="person" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
            '<div style="flex:1;min-width:0;">' +
              '<div class="person-name">' + escapeHtml(g.company || '（未命名）') + '　' + badge + '</div>' +
              '<div class="tiny">' + escapeHtml(when) +
                (left && !sent ? '　剩 ' + left : '') + '</div>' +
            '</div>' +
            '<button class="btn btn-ghost btn-sm" data-go="' + escapeHtml(g.id) + '">回到管理頁</button>' +
            '<button class="cart-x" data-forget="' + escapeHtml(g.id) + '" title="從這台裝置移除">×</button>' +
          '</div>';
        }).join('') +
        DEVICE_ONLY_WARNING +
      '</div></div>';
  }

  function wireCard(root) {
    root.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        const g = loadMyGroups().filter(function (x) { return x.id === b.dataset.go; })[0];
        if (g) location.href = adminUrlFor(g.id, g.token);
      });
    });
    root.querySelectorAll('[data-forget]').forEach(function (b) {
      b.addEventListener('click', function () {
        forgetMyGroup(b.dataset.forget);
        refresh();
      });
    });
  }

  function openGroupsModal() {
    wireCard(openModal(cardHtml(visibleGroups().slice(0, 3))));
  }

  function syncBadge(list) {
    let badge = toggleBtn.querySelector('.fab-badge');
    if (list.length) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'fab-badge';
        toggleBtn.appendChild(badge);
      }
      badge.textContent = list.length;
    } else if (badge) {
      badge.remove();
    }
  }

  function refresh() {
    const list = visibleGroups();
    syncBadge(list);
    if (document.getElementById('myGroups')) openGroupsModal(); // 浮窗開著的話內容也要跟著換新
  }

  refresh();

  /* 跟後端確認一下目前狀態，避免顯示過期資訊；
     如果後端已經找不到這個揪團（例如後端／資料庫整個換過），
     本機留著的舊快取就沒意義了，直接忘掉，不要一直卡在畫面上。 */
  const saved = loadMyGroups();
  saved.slice(0, 3).forEach(function (g) {
    apiGet('getAdminData', { session: g.id, token: g.token }).then(function (res) {
      updateMyGroup(g.id, {
        status: res.session.status,
        organizerClosed: res.session.organizerClosed,
        deadline: res.session.deadline,
        company: res.session.company,
        deliveryDate: res.session.deliveryDate
      });
      refresh();
    }).catch(function (err) {
      const msg = (err && err.message) || '';
      if (msg.indexOf('連結無效') > -1 || msg.indexOf('管理權杖不正確') > -1) {
        forgetMyGroup(g.id);
        refresh();
      }
      /* 其他錯誤（例如網路暫時不通）就沿用本機那份，不要因為一次連線失敗就忘掉 */
    });
  });
}
</script>
</body>
</html>
